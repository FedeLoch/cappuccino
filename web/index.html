<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Cappuccino</title>
<link rel="icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400&family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="studio" hidden>
<canvas id="canvas"></canvas>
<canvas id="overlay"></canvas>

<div id="left" class="pill">
  <button class="icon" data-key="projects" data-icon="gallery" data-action="projects" aria-label="Projects"></button>
  <button class="icon" data-key="more" data-icon="actions" data-action="more" aria-label="More"></button>
  <button class="icon" data-key="references" data-icon="references" data-action="references" aria-label="References"></button>
  <button class="icon" data-key="view" data-icon="view" data-action="view" aria-label="Art direction"></button>
  <button class="icon" data-key="tools" id="tools-button" data-icon="select" data-action="tools" aria-label="Tools"></button>
</div>

<div id="right" class="pill">
  <button class="icon" data-key="brushes" id="brush-button" data-icon="brush" aria-label="Brushes"></button>
  <button class="icon" data-key="eraser" id="eraser-button" data-icon="eraser" aria-label="Eraser"></button>
  <button class="icon" data-key="layers" data-icon="layers" data-action="layers" aria-label="Layers"></button>
  <button id="color-button" class="swatch-button" aria-label="Color"><span></span></button>
</div>

<div id="more-bar" class="pill" hidden>
  <button class="icon" data-key="create" data-icon="create" data-action="create" aria-label="Create"></button>
  <button class="icon" data-key="study" data-icon="figure" data-action="study" aria-label="Study"></button>
  <button class="icon" data-key="artwork" data-icon="rename" data-action="artwork" aria-label="Artwork"></button>
  <button class="icon" data-key="export" data-icon="export" data-action="export" aria-label="Export"></button>
  <button class="icon" data-key="settings" data-icon="settings" data-action="settings" aria-label="Settings"></button>
</div>

<div id="sliders" class="pill vertical">
  <div class="slider" id="size-slider" role="slider" tabindex="0" aria-label="Brush size" aria-valuemin="0" aria-valuemax="1000">
    <div class="track"></div><div class="fill"></div><div class="thumb"></div>
  </div>
  <div class="slider" id="opacity-slider" role="slider" tabindex="0" aria-label="Brush opacity" aria-valuemin="0" aria-valuemax="1000">
    <div class="track"></div><div class="fill"></div><div class="thumb"></div>
  </div>
</div>

<div id="recent" class="pill vertical">
  <button class="dot" aria-label="Use this color"></button>
  <button class="dot" aria-label="Use this color"></button>
  <button class="dot" aria-label="Use this color"></button>
  <button class="dot" aria-label="Use this color"></button>
</div>

<canvas id="peek" role="button" aria-label="Wake your companion" hidden></canvas>
<canvas id="hands" hidden></canvas>
<canvas id="companion" role="button" aria-label="Companion"></canvas>

<div id="warmup-bar" hidden></div>
<div id="panel" hidden><div id="panel-body"></div></div>
</div>

<div id="home"></div>
<pre id="stats" hidden></pre>
<div id="message" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
